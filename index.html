<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Small Prediction Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        button:hover {
            background-color: #2563eb;
        }
        .result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Big/Small Predictor Tool</h2>
    <p>पैटर्न और ट्रेंड के आधार पर अगला अनुमान देखें</p>
    
    <button onclick="generatePrediction()">अगला प्रेडिक्शन देखें</button>
    
    <div class="result" id="predictionResult">परिणाम: --</div>
</div>

<script>
    function generatePrediction() {
        const outcomes = ["BIG", "SMALL"];
        // रैंडम प्रेडिक्शन जनरेट करने का लॉजिक (इसे आप अपने अनुसार बदल सकते हैं)
        const randomIndex = Math.floor(Math.random() * outcomes.length);
        const selectedResult = outcomes[randomIndex];
        
        document.getElementById("predictionResult").innerText = "परिणाम: " + selectedResult;
    }
</script>

</body>
</html>
