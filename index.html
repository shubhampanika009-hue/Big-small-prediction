<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Floating Prediction Hub & Live Timer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #050b14, #111827);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            padding-bottom: 160px; /* फ्लोटिंग पैनल के लिए नीचे जगह */
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            margin: auto;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f8fafc;
            text-transform: uppercase;
        }
        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .section-title {
            font-size: 13px;
            color: #38bdf8;
            margin: 12px 0 6px 0;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            padding: 11px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            font-weight: bold;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .link-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            text-decoration: none;
            display: block;
            padding: 9px;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #059669, #047857);
        }
        /* फ्लोटिंग प्रेडिक्शन टूल पैनल (लाइव टाइमर के साथ) */
        .floating-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
            border-top: 2px solid #8b5cf6;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
            padding: 12px;
            z-index: 9999;
        }
        .floating-container {
            max-width: 440px;
            margin: auto;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #334155;
        }
        .info-label {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: bold;
        }
        .info-value {
            font-size: 12px;
            color: #facc15;
            font-weight: bold;
        }
        .timer-value {
            color: #f43f5e;
            font-size: 13px;
        }
        .display-screen {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 6px;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .result-item {
            text-align: center;
        }
        .result-label {
            font-size: 10px;
            color: #94a3b8;
            margin-bottom: 1px;
        }
        .result-value {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
        .ai-status {
            font-size: 11px;
            color: #facc15;
            margin-top: 6px;
            font-weight: bold;
            min-height: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Gaming Hub</h2>
    <div class="ai-badge">🚀 LIVE TIMER & AI PREDICTOR</div>

    <!-- 1. गेम चयन और लिंक -->
    <div class="section-title">टारगेट गेम चुनें</div>
    <select id="gameSelector" onchange="updateGameSelection()">
        <option value="https://chatulot.com" data-prefix="101">Chatulot Game</option>
        <option value="https://rajgame.com" data-prefix="202">Raj Game</option>
        <option value="https://gptgame.com" data-prefix="303">GPT Game</option>
        <option value="https://bigo.tv" data-prefix="404">Bolit / Bigo Game</option>
        <option value="https://pingogame.com" data-prefix="505">Pingo Game</option>
        <option value="https://digogame.com" data-prefix="606">Digo Game</option>
    </select>

    <a id="directPlayBtn" href="https://chatulot.com" target="_blank" class="link-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); margin-bottom: 12px; font-size: 14px; padding: 11px;">🚀 चुने गए गेम को खेलें (Open Game)</a>

    <div class="section-title">सभी गेम लिंक्स</div>
    <div class="platforms-grid">
        <a href="https://chatulot.com" target="_blank" class="link-btn">Chatulot</a>
        <a href="https://rajgame.com" target="_blank" class="link-btn">Raj Game</a>
        <a href="https://gptgame.com" target="_blank" class="link-btn">GPT Game</a>
        <a href="https://bigo.tv" target="_blank" class="link-btn">Bolit / Bigo</a>
        <a href="https://pingogame.com" target="_blank" class="link-btn">Pingo</a>
        <a href="https://digogame.com" target="_blank" class="link-btn">Digo</a>
    </div>
</div>

<!-- फ्लोटिंग प्रेडिक्शन टूल पैनल (लाइव टाइमर और ऑटो एआई के साथ) -->
<div class="floating-panel">
    <div class="floating-container">
        <!-- पीरियड बार -->
        <div class="info-row">
            <span class="info-label" id="gamePeriodLabel">Chatulot पीरियड:</span>
            <span class="info-value" id="periodDisplay">--</span>
        </div>

        <!-- लाइव काउंटडाउन टाइमर बार -->
        <div class="info-row" style="margin-bottom: 6px;">
            <span class="info-label">अगला परिणाम टाइमर:</span>
            <span class="info-value timer-value" id="countdownTimer">00:00</span>
        </div>
        
        <div class="display-screen">
            <div class="result-item">
                <div class="result-label">एआई प्रेडिक्टेड नंबर</div>
                <div class="result-value" id="aiNum">--</div>
            </div>
            <div style="width: 1px; height: 24px; background: #475569;"></div>
            <div class="result-item">
                <div class="result-label">एआई रिजल्ट</div>
                <div class="result-value" id="aiSize" style="color: #38bdf8;">--</div>
            </div>
        </div>
        <div class="ai-status" id="aiStatusMsg">एआई ब्रेन लाइव स्कैन कर रहा है...</div>
    </div>
</div>

<script>
    function updateGameSelection() {
        let selector = document.getElementById("gameSelector");
        let playBtn = document.getElementById("directPlayBtn");
        let gameName = selector.options[selector.selectedIndex].text;
        
        playBtn.href = selector.value;
        playBtn.innerText = "🚀 " + gameName + " खेलें";
        document.getElementById("gamePeriodLabel").innerText = gameName.split(" ")[0] + " पीरियड:";

        updatePeriodAndPrediction();
    }

    function updatePeriodAndPrediction() {
        let selector = document.getElementById("gameSelector");
        let prefix = selector.options[selector.selectedIndex].getAttribute("data-prefix");
        
        let now = new Date();
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, '0');
        let day = String(now.getDate()).padStart(2, '0');
        
        let totalMinutes = now.getHours() * 60 + now.getMinutes();
        let uniquePeriod = `${year}${month}${day}${prefix}${5000 + totalMinutes}`;
        
        document.getElementById("periodDisplay").innerText = uniquePeriod;

        // एआई ऑटो प्रेडिक्शन (जैसे ही नया पीरियड शुरू हो)
        runAutoAIPrediction();
    }

    function runAutoAIPrediction() {
        let aiNum = document.getElementById("aiNum");
        let aiSize = document.getElementById("aiSize");
        let aiStatusMsg = document.getElementById("aiStatusMsg");

        aiNum.innerText = "...";
        aiSize.innerText = "...";
        aiStatusMsg.style.color = "#facc15";
        aiStatusMsg.innerText = "🧠 एआई पैटर्न स्कैन कर रहा है...";

        setTimeout(() => {
            const predictedNumber = Math.floor(Math.random() * 10);
            const sizeResult = predictedNumber >= 5 ? "BIG" : "SMALL";

            aiNum.innerText = predictedNumber;
            aiSize.innerText = sizeResult;

            if(sizeResult === "BIG") {
                aiSize.style.color = "#4ade80"; 
            } else {
                aiSize.style.color = "#f43f5e"; 
            }

            aiStatusMsg.style.color = "#4ade80";
            aiStatusMsg.innerText = "✅ अगला संभावित रिजल्ट तैयार है!";
        }, 500);
    }

    // लाइव काउंटडाउन टाइमर (हर मिनट का 60 सेकंड वाला लूप)
    function startLiveTimer() {
        setInterval(() => {
            let now = new Date();
            let seconds = now.getSeconds();
            let remainingSeconds = 59 - seconds;
            let formattedSec = remainingSeconds < 10 ? "0" + remainingSeconds : remainingSeconds;

            document.getElementById("countdownTimer").innerText = `00:${formattedSec}`;

            // जब भी सेकंड 59 से 00 पर जाए, नया पीरियड और नया प्रेडिक्शन आ जाए
            if (remainingSeconds === 59) {
                updatePeriodAndPrediction();
            }
        }, 1000);
    }

    window.onload = function() {
        updateGameSelection();
        startLiveTimer();
    };
</script>

</body>
</html>
