<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Prediction Tool & Gaming Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            text-align: center;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            margin: auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .live-badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .section-title {
            font-size: 14px;
            color: #38bdf8;
            margin: 15px 0 8px 0;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .link-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            text-decoration: none;
            display: block;
            padding: 10px;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #059669, #047857);
        }
        .tool-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #334155;
        }
        button.predict-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            transition: 0.2s;
            margin-top: 5px;
        }
        button.predict-btn:active {
            transform: scale(0.98);
        }
        .display-screen {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }
        .result-item {
            text-align: center;
        }
        .result-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 3px;
        }
        .result-value {
            font-size: 26px;
            font-weight: bold;
            color: #4ade80;
        }
        .timer {
            font-size: 13px;
            color: #facc15;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Live Predictor</h2>
    <div class="live-badge">● LIVE ALGORITHM TOOL</div>

    <!-- सभी गेम प्लेटफॉर्म्स के लिंक्स -->
    <div class="section-title">गेम प्लेटफॉर्म्स (Game Links)</div>
    <div class="platforms-grid">
        <a href="https://example.com" target="_blank" class="link-btn">Chatulot</a>
        <a href="https://example.com" target="_blank" class="link-btn">Raj Game</a>
        <a href="https://example.com" target="_blank" class="link-btn">GPT Game</a>
        <a href="https://example.com" target="_blank" class="link-btn">Bolit / Bigo</a>
        <a href="https://example.com" target="_blank" class="link-btn">Pingo</a>
        <a href="https://example.com" target="_blank" class="link-btn">Digo</a>
    </div>

    <!-- लाइव प्रेडिक्शन टूल सेक्शन -->
    <div class="section-title">लाइव प्रेडिक्शन एल्गोरिथम</div>
    <div class="tool-box">
        <button class="predict-btn" onclick="startPrediction()">🔮 प्रेडिक्शन जनरेट करें</button>
        
        <div class="display-screen">
            <div class="result-item">
                <div class="result-label">नंबर (Number)</div>
                <div class="result-value" id="numDisplay">--</div>
            </div>
            <div style="width: 1px; height: 35px; background: #475569;"></div>
            <div class="result-item">
                <div class="result-label">परिणाम (Size)</div>
                <div class="result-value" id="sizeDisplay" style="color: #38bdf8;">--</div>
            </div>
        </div>
        <div class="timer" id="timerText">अगला प्रेडिक्शन तैयार है</div>
    </div>
</div>

<script>
    function startPrediction() {
        let numDisplay = document.getElementById("numDisplay");
        let sizeDisplay = document.getElementById("sizeDisplay");
        let timerText = document.getElementById("timerText");

        // लोडिंग इफ़ेक्ट (जैसे YouTube पर होता है)
        numDisplay.innerText = "...";
        sizeDisplay.innerText = "...";
        timerText.innerText = "एल्गोरिथम स्कैन हो रहा है...";

        setTimeout(() => {
            // 0 से 9 तक का रैंडम पैटर्न नंबर एल्गोरिथम
            const randomNum = Math.floor(Math.random() * 10);
            
            // 0-4 Small, 5-9 Big रूल
            const size = randomNum >= 5 ? "BIG" : "SMALL";

            numDisplay.innerText = randomNum;
            sizeDisplay.innerText = size;
            
            // रंग बदलना (Big के लिए हरा, Small के लिए पीला)
            if(size === "BIG") {
                sizeDisplay.style.color = "#4ade80";
            } else {
                sizeDisplay.style.color = "#f43f5e";
            }

            timerText.innerText = "सफलतापूर्वक प्रेडिक्ट हो गया!";
        }, 600); // 0.6 सेकंड का शानदार एनिमेशन डिले
    }
</script>

</body>
</html>
