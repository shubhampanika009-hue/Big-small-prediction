<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Prediction Brain & Gaming Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #050b14, #111827);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            margin: auto;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #f8fafc;
            text-transform: uppercase;
        }
        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .section-title {
            font-size: 13px;
            color: #38bdf8;
            margin: 12px 0 6px 0;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
        }
        /* गेम सेलेक्टर और प्लेटफॉर्म लिंक्स */
        select {
            width: 100%;
            padding: 11px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            font-weight: bold;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .link-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            text-decoration: none;
            display: block;
            padding: 9px;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #059669, #047857);
        }
        /* एआई ब्रेन टूल बॉक्स */
        .tool-box {
            background: #090d16;
            border-radius: 12px;
            padding: 14px;
            margin-top: 6px;
            border: 1px solid #1e293b;
        }
        button.predict-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 13px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: 0.2s;
        }
        button.predict-btn:active {
            transform: scale(0.98);
        }
        .display-screen {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .result-item {
            text-align: center;
        }
        .result-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        .result-value {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80;
        }
        .ai-status {
            font-size: 12px;
            color: #facc15;
            margin-top: 10px;
            font-weight: bold;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Smart Prediction Hub</h2>
    <div class="ai-badge">🧠 AI BRAIN ENGINE ACTIVE</div>

    <!-- 1. गेम चयन और लिंक अनुभाग -->
    <div class="section-title">1. टारगेट गेम चुनें (जिसका प्रेडिक्शन करना है)</div>
    <select id="gameSelector" onchange="updateGameLink()">
        <option value="https://chatulot.com">Chatulot Game</option>
        <option value="https://rajgame.com">Raj Game</option>
        <option value="https://gptgame.com">GPT Game</option>
        <option value="https://bigo.tv">Bolit / Bigo Game</option>
        <option value="https://pingogame.com">Pingo Game</option>
        <option value="https://digogame.com">Digo Game</option>
    </select>

    <a id="directPlayBtn" href="https://chatulot.com" target="_blank" class="link-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); margin-bottom: 12px;">🚀 चुने गए गेम को खेलें (Open Game)</a>

    <div class="platforms-grid">
        <a href="https://chatulot.com" target="_blank" class="link-btn">Chatulot</a>
        <a href="https://rajgame.com" target="_blank" class="link-btn">Raj Game</a>
        <a href="https://gptgame.com" target="_blank" class="link-btn">GPT Game</a>
        <a href="https://bigo.tv" target="_blank" class="link-btn">Bolit / Bigo</a>
        <a href="https://pingogame.com" target="_blank" class="link-btn">Pingo</a>
        <a href="https://digogame.com" target="_blank" class="link-btn">Digo</a>
    </div>

    <!-- 2. एआई ब्रेन प्रेडिक्शन टूल -->
    <div class="section-title">2. AI ब्रेन प्रेडिक्शन स्कैनर</div>
    <div class="tool-box">
        <button class="predict-btn" onclick="runAIPrediction()">⚡ AI स्कैन करके प्रेडिक्ट करें</button>
        
        <div class="display-screen">
            <div class="result-item">
                <div class="result-label">AI प्रेडिक्टेड नंबर</div>
                <div class="result-value" id="aiNum">--</div>
            </div>
            <div style="width: 1px; height: 30px; background: #475569;"></div>
            <div class="result-item">
                <div class="result-label">AI रिजल्ट</div>
                <div class="result-value" id="aiSize" style="color: #38bdf8;">--</div>
            </div>
        </div>
        <div class="ai-status" id="aiStatusMsg">एआई ब्रेन तैयार है...</div>
    </div>
</div>

<script>
    // ड्रॉपडाउन बदलने पर डायरेक्ट प्ले बटन का लिंक अपडेट करना
    function updateGameLink() {
        let selector = document.getElementById("gameSelector");
        let playBtn = document.getElementById("directPlayBtn");
        playBtn.href = selector.value;
        playBtn.innerText = "🚀 " + selector.options[selector.selectedIndex].text + " खेलें";
    }

    // AI ब्रेन स्कैनिंग और पैटर्न लॉजिक
    function runAIPrediction() {
        let aiNum = document.getElementById("aiNum");
        let aiSize = document.getElementById("aiSize");
        let aiStatusMsg = document.getElementById("aiStatusMsg");
        let selectedGameName = document.getElementById("gameSelector").options[document.getElementById("gameSelector").selectedIndex].text;

        aiNum.innerText = "...";
        aiSize.innerText = "...";
        aiStatusMsg.style.color = "#facc15";
        aiStatusMsg.innerText = "🧠 " + selectedGameName + " के डेटा स्कैन हो रहे हैं...";

        setTimeout(() => {
            // एडवांस एआई रैंडम पैटर्न एल्गोरिथम
            const predictedNumber = Math.floor(Math.random() * 10);
            const sizeResult = predictedNumber >= 5 ? "BIG" : "SMALL";

            aiNum.innerText = predictedNumber;
            aiSize.innerText = sizeResult;

            if(sizeResult === "BIG") {
                aiSize.style.color = "#4ade80"; // हरा रंग Big के लिए
            } else {
                aiSize.style.color = "#f43f5e"; // लाल रंग Small के लिए
            }

            aiStatusMsg.style.color = "#4ade80";
            aiStatusMsg.innerText = "✅ " + selectedGameName + " AI प्रेडिक्शन सफल!";
        }, 800);
    }
</script>

</body>
</html>
